<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoLノート トップ</title>
<style>
/* 明るい配色（標準）。白背景でも読めるよう、文字に使う色は濃いめ */
:root {
  --bg: #f3f5f8;
  --panel: #ffffff;
  --panel-2: #eef1f5;
  --border: #d3d9e1;
  --text: #1b2330;
  --muted: #5b6676;
  --accent: #0a7d63;
  --accent-ink: #ffffff;
  --good: #1d7f45;
  --warn: #9a5b00;
  --bad: #c0392b;
  --radius: 10px;
  color-scheme: light;
}
/* 暗い配色（ヘッダーの切り替えボタンで選ぶ） */
:root[data-theme="dark"] {
  --bg: #0f1218;
  --panel: #171c25;
  --panel-2: #1f2632;
  --border: #2c3544;
  --text: #e6e9ef;
  --muted: #8b95a7;
  --accent: #3ec9a7;
  --accent-ink: #06231c;
  --good: #5fd38d;
  --warn: #f2b84b;
  --bad: #f06d6d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  font-size: 15px; line-height: 1.6;
}
header {
  display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  position: sticky; top: 0; z-index: 5;
}
header h1 { font-size: 16px; margin: 0; }
header h1 span { color: var(--accent); }
.champ-select { display: flex; align-items: center; gap: 8px; }
.champ-select select { width: auto; min-width: 160px; font-size: 16px; font-weight: 700; padding: 6px 10px; }
nav { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.tab {
  background: transparent; color: var(--muted); border: 1px solid var(--border);
  padding: 8px 14px; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 600;
}
.tab:hover { color: var(--text); }
.tab.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tab kbd { opacity: .6; font-size: 11px; margin-left: 4px; font-family: inherit; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
section.page { display: none; }
section.page.active { display: block; }
.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 14px;
}
.card h2 { font-size: 16px; margin: 0 0 10px; }
.card h3 { font-size: 14px; margin: 14px 0 6px; color: var(--accent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } nav { margin-left: 0; } }
label.field { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
select, input[type=text], textarea {
  width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font: inherit;
}
textarea { min-height: 90px; resize: vertical; }
select:focus, input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button.btn {
  background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer;
}
button.btn:hover { border-color: var(--accent); }
button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
button.btn.danger { color: var(--bad); }
button.btn.sm { padding: 3px 10px; font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > input[type=text] { flex: 1; min-width: 160px; width: auto; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 13px;
}
.chip button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0; }
.chip.toggle { cursor: pointer; user-select: none; }
.chip.toggle.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
.reco { display: grid; gap: 8px; }
.reco-item {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: start;
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
}
.reco-item.top { border-color: var(--accent); }
.rank { font-size: 18px; font-weight: 800; color: var(--muted); text-align: center; }
.reco-item.top .rank { color: var(--accent); }
.reco-name { font-weight: 700; }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; margin-left: 6px; }
.reasons { margin: 4px 0 0; padding-left: 18px; font-size: 13px; }
.reasons li.plus::marker { content: "＋ "; color: var(--good); }
.reasons li.minus::marker { content: "－ "; color: var(--bad); }
.side { display: grid; justify-items: end; gap: 6px; }
.score { font-weight: 800; font-variant-numeric: tabular-nums; }
.verdict { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 10px; }
.verdict.ok { border-color: var(--good); }
.verdict.mid { border-color: var(--warn); }
.verdict.ng { border-color: var(--bad); }
.verdict strong { font-size: 16px; }
.subtabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.subtabs .tab { padding: 12px 18px; font-size: 16px; }
.cheat ul { margin: 0 0 6px; padding-left: 20px; }
.cheat li { margin: 4px 0; font-size: 16px; }
.cheat li b { color: var(--accent); }
.cheat h3 { font-size: 13px; color: var(--muted); font-weight: 600; }
.warnbox { border-left: 3px solid var(--warn); padding: 8px 12px; background: var(--panel-2); border-radius: 0 8px 8px 0; margin-bottom: 14px; }
.warnbox:empty { display: none; }
.death { border-top: 1px solid var(--border); padding: 8px 0; }
.death:first-child { border-top: 0; }
.death .meta { font-size: 12px; color: var(--muted); }
details.game { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
details.game summary { cursor: pointer; }
.win { color: var(--good); font-weight: 700; }
.lose { color: var(--bad); font-weight: 700; }
.bar { height: 8px; background: var(--accent); border-radius: 4px; }
.stat-row { display: grid; grid-template-columns: 1fr 120px 30px; gap: 8px; align-items: center; font-size: 13px; margin: 4px 0; }
.lanes { display: flex; gap: 8px; }
.lanes a { color: var(--muted); font-size: 13px; text-decoration: none; border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; }
.lanes a:hover { color: var(--text); border-color: var(--accent); }
ul.rich { margin: 0 0 6px; padding-left: 20px; }
.cheat ul.rich > li { margin: 8px 0; }
.rich-d { color: var(--muted); font-size: 14px; font-weight: normal; margin-top: 1px; }
.cheat ul.rich > li > b { color: var(--text); }
.sec-summary { background: var(--panel-2); border-radius: 8px; padding: 8px 12px; margin: 0 0 10px; }
.sec-group { margin-top: 12px; }
.sec-group.good > .vs-label { color: var(--good); }
.sec-group.bad > .vs-label { color: var(--bad); }
.sec-group.good, .sec-group.bad { border-left: 3px solid; padding-left: 10px; }
.sec-group.good { border-color: var(--good); }
.sec-group.bad { border-color: var(--bad); }
.build { border: 1px solid var(--accent); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 15px; }
.build div { margin: 2px 0; }
.build details { margin-top: 4px; font-size: 14px; }
.build summary { cursor: pointer; color: var(--muted); }
.build ol { margin: 4px 0 0; padding-left: 20px; }
.cheat h3.common-h { font-size: 14px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 12px; margin-top: 18px; }
.vs-picker { display: grid; gap: 8px; margin: 4px 0 6px; }
.vs-picker .chips { margin-top: 0; }
.vs-picker button.chip { font: inherit; font-size: 15px; color: var(--text); padding: 6px 14px; cursor: pointer; }
.vs-picker button.chip.on { color: var(--accent-ink); }
.vs-picker select { max-width: 320px; }
.vs-card { border: 1px solid var(--border); border-radius: var(--radius); margin-top: 14px; padding: 12px 14px; background: var(--bg); }
.vs-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.vs-card h3 { font-size: 18px; color: var(--text); font-weight: 700; margin: 0; }
.vs-summary { margin: 6px 0 10px; }
.vs-label { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
.vs-sec { margin-top: 10px; }
.vs-sec ul, .vs-sec ol { margin: 0; padding-left: 20px; }
.cheat .vs-sec li, .cheat .vs-note li { font-size: 15px; }
.vs-dodge li { margin-bottom: 6px; }
.vs-note { background: var(--panel-2); border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 0 8px 8px 0; margin-top: 8px; }
.vs-note p { margin: 4px 0 0; }
.vs-flow { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 4px 0 0; }
.vs-flow dt { font-weight: 700; color: var(--muted); font-size: 13px; padding-top: 2px; }
.vs-flow dd { margin: 0; }
@media (max-width: 560px) { .vs-flow { grid-template-columns: 1fr; } .vs-flow dd { margin-bottom: 6px; } }
.vs-tip { margin-top: 6px; }
.vs-time { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
@media (max-width: 560px) { .vs-time { grid-template-columns: 1fr; } }
.vs-time > div { border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
.vs-time .go { border-color: var(--good); }
.vs-time .go .vs-label { color: var(--good); }
.vs-time .back { border-color: var(--bad); }
.vs-time .back .vs-label { color: var(--bad); }
.badge { font-size: 13px; font-weight: 700; border-radius: 999px; padding: 1px 10px; border: 1px solid; }
.badge.good { color: var(--good); border-color: var(--good); }
.badge.even { color: var(--warn); border-color: var(--warn); }
.badge.bad { color: var(--bad); border-color: var(--bad); }
details.gl { margin: 6px 0 10px; font-size: 14px; }
details.gl summary { cursor: pointer; color: var(--muted); }
.gl-row { display: grid; grid-template-columns: 170px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
@media (max-width: 560px) { .gl-row { grid-template-columns: 1fr; gap: 2px; } }
code { font-family: Consolas, "Courier New", monospace; background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
code.cmd { padding: 6px 10px; font-size: 14px; user-select: all; }
.steps { padding-left: 20px; margin: 6px 0 0; }
.steps li { margin: 6px 0; }
.toast {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: var(--accent); color: var(--accent-ink); padding: 8px 16px; border-radius: 8px;
  font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>

// LoLノート 共通アプリ。レーン固有のデータは window.LANE（data/<lane>.js）から受け取る。
(() => {
const L = window.LANE;
// tools/build-single.js で作った1ファイル版（統計の更新手順は出さない）
const SINGLE = !!window.LOL_NOTE_SINGLE;
// 作成済みのレーン（ヘッダーのリンクに使う）
const LANES = [{ id: 'top', name: 'トップ' }, { id: 'sup', name: 'サポート' }];

// ================= 保存 =================
// 全レーンを1つのキーに保存し、レーンごとに分けて持つ
const KEY = 'lol-note-v1';
const emptyLane = () => ({
  champ: '', pool: [], poolOnly: false, memoAll: false,
  pick: { ally: '', enemies: [] }, current: null, games: [], notes: {}, custom: [],
});
function load() {
  let root = { lanes: {} };
  try { root = JSON.parse(localStorage.getItem(KEY)) || root; } catch (e) {}
  if (!root.lanes) root.lanes = {};
  if (!root.lanes[L.id]) {
    root.lanes[L.id] = emptyLane();
    if (L.id === 'sup') migrateThresh(root.lanes.sup);
  }
  root.lanes[L.id] = Object.assign(emptyLane(), root.lanes[L.id]);
  return root;
}
// 旧 thresh-tool.html のメモを引き継ぐ
function migrateThresh(ls) {
  try {
    const old = JSON.parse(localStorage.getItem('thresh-tool-v1'));
    if (!old) return;
    const tag = (g) => Object.assign(g, { champ: 'スレッシュ', ally: g.adc || '' });
    ls.games = (old.games || []).map(tag);
    if (old.current) ls.current = tag(old.current);
    ls.champ = 'スレッシュ';
  } catch (e) {}
}
const ROOT = load();
const LS = ROOT.lanes[L.id];
function save() { try { localStorage.setItem(KEY, JSON.stringify(ROOT)); } catch (e) {} }

// ================= 共通 =================
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => s.trim().replace(/=/g, '＝').replace(/\s+/g, '');
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1500);
}
function fmtDate(ts) {
  const d = new Date(ts);
  return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
}

const blankChamp = (name) => ({ name, type: '追加', peel: 1, catch: false,
  great: [], good: [], weakVs: [], strongVs: [], cheat: {}, custom: true });
const champs = () => [...L.champions, ...LS.custom.map(blankChamp)];
const getChamp = (name) => champs().find((c) => c.name === name);
if (!getChamp(LS.champ)) LS.champ = champs()[0].name;

// 統計（data/<lane>-stats.js が無ければ表示しないだけ）
const ST = window.LANE_STATS;

const pairScore = (r) => Math.max(-2, Math.min(2, (r.win - 50) * 0.15 * Math.min(1, r.games / 50)));
const statLine = (s) => s ? `ティア${s.tier} ／ 勝率 ${s.win}% ／ ピック ${s.pick}% ／ BAN ${s.ban}%` : '';

// ================= 画面の骨組み =================
document.title = `LoLノート ${L.name}`;
document.body.innerHTML = `

  <div class="champ-select">
    <select id="champ" title="使用チャンピオン"></select>
    <button class="btn sm" id="champ-add" title="データに無いチャンピオンを追加">＋追加</button>

<main>

  $('champ-del').hidden = !LS.custom.includes(LS.champ);
}
$('champ-del').addEventListener('click', () => {
  const name = LS.champ;
  const games = LS.games.filter((g) => g.champ === name).length;
  if (!confirm(`${name} をリストから削除しますか？${games ? `\n（反省メモの過去の試合 ${games}件は残ります）` : ''}`)) return;

});

// 配色（明るい / 暗い）。端末ごとに覚えておく。標準は明るい配色
const THEME_KEY = 'lol-note-theme';
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $('theme-toggle').textContent = theme === 'dark' ? '☀ 明るく' : '🌙 暗く';
}
let theme = 'light';
try { theme = localStorage.getItem(THEME_KEY) === 'dark' ? 'dark' : 'light'; } catch (e) {}
applyTheme(theme);
$('theme-toggle').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}

// ================= BAN/PICK =================
function scoreChamp(c, ally, enemies) {
  let score = 0; const reasons = [];
  const s = statOf(c);
  const addPair = (r, label) => {
    const v = pairScore(r);
    score += v;
    if (Math.abs(v) >= 0.3) reasons.push([v > 0 ? 'plus' : 'minus', `${label} ${r.win}%（${r.games}試合）`]);
  };
  // 実データが30試合以上ある組み合わせは、手書きの相性（great/good/weakVs/strongVs）より優先する
  const duo = ally && s && s.duo && s.duo[ally];
  if (duo) addPair(duo, `${ally}とのデュオ勝率`);
  const trusted = (r) => r && r.games >= 30;
  for (const en of enemies) {
    if (en !== c.name && s && s.matchups && s.matchups[en]) addPair(s.matchups[en], `${en}との対面勝率`);
  }
  if (!trusted(duo)) {
    if (c.great.includes(ally)) { score += 3; reasons.push(['plus', `${ally}と特に相性が良い（相性メモ）`]); }
    else if (c.good.includes(ally)) { score += 1.5; reasons.push(['plus', `${ally}と相性が良い（相性メモ）`]); }
  }
  for (const en of enemies) {
    if (en === c.name) { score -= 10; reasons.push(['minus', '相手が使用中']); continue; }
    if (trusted(s && s.matchups && s.matchups[en])) continue;
    if (c.weakVs.includes(en)) { score -= 2; reasons.push(['minus', `${en}が苦手（相性メモ）`]); }
    if (c.strongVs.includes(en)) { score += 1.5; reasons.push(['plus', `${en}に強い（相性メモ）`]); }
  }
  const divers = enemies.filter((e) => (L.divers || []).includes(e)).length;
  if (divers >= 2) {
    const v = (c.peel - 1) * Math.min(divers - 1, 2);
    if (v > 0) { score += v; reasons.push(['plus', `相手にダイバーが${divers}体 → 守りが活きる`]); }
    if (v < 0) { score += v; reasons.push(['minus', `相手にダイバーが${divers}体 → 守りが薄い`]); }
  }
  const immobile = enemies.filter((e) => (L.immobile || []).includes(e)).length;
  if (immobile >= 2 && c.catch) {
    score += 1; reasons.push(['plus', `逃げスキルの少ない相手が${immobile}体 → キャッチが刺さる`]);
  }
  // 勝率を少しだけ反映（50%から1%ずれるごとに±0.6、最大±2。試合数が少ないと半分）
  if (s && s.win !== undefined) {
    let v = Math.max(-2, Math.min(2, (s.win - 50) * 0.6));
    if (s.count < 300) v /= 2;
    if (v >= 0.5) reasons.push(['plus', `今のパッチで勝率 ${s.win}%`]);
    if (v <= -0.5) reasons.push(['minus', `今のパッチで勝率 ${s.win}%`]);
    score += v;
  }
  if (c.custom) reasons.push(['minus', '相性データ未登録']);
  return { c, score: Math.round(score * 10) / 10, reasons };
}
const reasonList = (rs) => rs.length
  ? `<ul class="reasons">${rs.map(([k, t]) => `<li class="${k}">${esc(t)}</li>`).join('')}</ul>` : '';

function renderPick() {
  const { ally, enemies } = LS.pick;
  $('ally').value = ally;
  $('pool-only').checked = LS.poolOnly;
  $('enemy-chips').innerHTML = enemies.map((e, i) =>
    `<span class="chip">${esc(e)}<button data-i="${i}" title="削除">×</button></span>`).join('')
    || '<span class="muted small">まだ追加されていません</span>';

  const all = champs().map((c) => scoreChamp(c, ally, enemies)).sort((a, b) => b.score - a.score);
  const list = LS.poolOnly && LS.pool.length ? all.filter((r) => LS.pool.includes(r.c.name)) : all;
  $('reco').innerHTML = list.slice(0, 6).map((r, i) => `
    <div class="reco-item ${i === 0 ? 'top' : ''}">
      <div class="rank">${i + 1}</div>
      <div>
        <span class="reco-name">${esc(r.c.name)}</span><span class="tag">${esc(r.c.type)}</span>
        ${statOf(r.c) ? `<div class="muted small">${esc(statLine(statOf(r.c)))}</div>` : ''}
        ${reasonList(r.reasons) || '<div class="muted small">特記事項なし</div>'}
      </div>
      <div class="side">
        <span class="score">${r.score > 0 ? '+' : ''}${r.score}</span>
        ${r.c.name === LS.champ ? '<span class="muted small">使用中</span>'
          : `<button class="btn sm" data-use="${esc(r.c.name)}">使う</button>`}
      </div>
    </div>`).join('') || '<span class="muted small">プールが空です</span>';

  // 選択中のチャンピオンの判定
  const me = all.find((r) => r.c.name === LS.champ);
  const rank = list.indexOf(me) + 1;
  let cls = 'ok', head = `GO：${LS.champ}でOK`;
  if (me.score < 0) { cls = 'ng'; head = '非推奨：他のチャンピオンを検討'; }
  else if (rank === 0 || rank > 3) { cls = 'mid'; head = '出せるけど、他にもっと良い選択肢あり'; }
  $('verdict-title').textContent = `${LS.champ}を出していい？`;
  const myStat = statOf(me.c) ? `<p class="small">${esc(statLine(statOf(me.c)))}</p>` : '';
  $('verdict').innerHTML = !ally && !enemies.length
    ? `${myStat}<p class="muted small">${esc(L.allyLabel)}と相手を入れると判定します。</p>`
    : `<div class="verdict ${cls}"><strong>${esc(head)}</strong>
         <div class="muted small">${rank ? `順位 ${rank}位 / ` : ''}スコア ${me.score}</div></div>
       ${myStat}${reasonList(me.reasons)}`;

  $('pool').innerHTML = champs().map((c) =>
    `<span class="chip toggle ${LS.pool.includes(c.name) ? 'on' : ''}" data-pool="${esc(c.name)}">${esc(c.name)}</span>`).join('');
}

// ================= チートシート =================
let cheatId = L.sections[0].id;
function renderCheat() {
  const c = getChamp(LS.champ);
  const tabs = [...L.sections, ...(L.enemyInfo ? [{ id: 'vs', label: '対面' }] : []), { id: 'notes', label: 'マイメモ' },
    ...(window.GLOSSARY ? [{ id: 'glossary', label: '用語' }] : [])];
  $('cheat-tabs').innerHTML = tabs.map((s) =>
    `<button class="tab ${s.id === cheatId ? 'active' : ''}" data-id="${s.id}">${esc(s.label)}</button>`).join('');

  if (cheatId === 'notes') {
    $('cheat-body').innerHTML = `
      <h2>${esc(c.name)} のマイメモ</h2>
      <p class="muted small">気づいたこと・反省から学んだことを書き溜める場所。自動で保存されます。</p>
      <textarea id="my-notes" style="min-height:260px" placeholder="例: 相手がモルガナのときはEを先に使わせてから…">${esc(LS.notes[c.name] || '')}</textarea>`;
    $('my-notes').addEventListener('input', (e) => { LS.notes[c.name] = e.target.value; save(); });

  }
  if (cheatId === 'vs') { renderVs(c); return; }
  if (cheatId === 'glossary') { $('cheat-body').innerHTML = `<h2>用語の説明</h2>${glossaryHtml()}`; return; }
  const own = c.cheat && c.cheat[cheatId];
  const common = L.common && L.common[cheatId];
  const label = L.sections.find((s) => s.id === cheatId).label;
  const note = (LS.notes[c.name] || '').trim();
  $('cheat-body').innerHTML = `
    <h2>${esc(c.name)} — ${esc(label)}</h2>
    ${buildHtml(c, cheatId)}
    ${!isEmptySection(own) ? sectionHtml(own)
      : `<p class="muted small">${esc(c.name)} 固有のチートシートはまだありません。data/${esc(L.id)}.js に追加するか、マイメモに書いてください。</p>`}
    ${!isEmptySection(common) ? `<h3 class="common-h">${esc(L.name)}共通</h3>${sectionHtml(common)}` : ''}

// チートシートの項目: 文字列 か [見出し, 説明]。セクション: 配列 か { summary, groups: [{ label, tone, items }] }
// （データファイルは自分で書くものなので、<b> などのタグはそのまま表示する）
const richItem = (t) => Array.isArray(t)
  ? `<li><b>${t[0]}</b>${t[1] ? `<div class="rich-d">${t[1]}</div>` : ''}</li>` : `<li>${t}</li>`;
const richList = (items) => (items && items.length ? `<ul class="rich">${items.map(richItem).join('')}</ul>` : '');
const isEmptySection = (v) => !v || (Array.isArray(v) ? !v.length : !(v.summary || (v.groups || []).length));
function sectionHtml(v) {
  if (Array.isArray(v)) return richList(v);
  return `${v.summary ? `<p class="sec-summary">${v.summary}</p>` : ''}${(v.groups || []).map((g) =>
    `<div class="sec-group ${g.tone || ''}"><div class="vs-label">${g.label}</div>${richList(g.items)}</div>`).join('')}`;
}
// LOL.PS の人気ビルド（装備タブ）と、スキルの上げ順・サモナースペル（Lv1〜3タブ）
function buildHtml(c, sec) {
  const s = statOf(c);
  const b = s && s.build;
  if (!b) return '';
  const src = ST ? `<span class="muted small">（LOL.PS パッチ${esc(ST.patch)}）</span>` : '';
  if (sec === 'early' && (b.skills.length || b.spells.length)) {
    return `<div class="build"><div class="vs-label">📊 データで見る基本 ${src}</div>
      ${b.skills.length ? `<div>スキル上げ: <b>${b.skills.map(esc).join(' → ')}</b> の順に最大まで上げる（R は 6・11・16 で必ず取る）</div>` : ''}
      ${b.spells.length ? `<div>サモナースペル: <b>${b.spells.map(esc).join(' ＋ ')}</b></div>` : ''}
    </div>`;
  }
  if (sec === 'items' && (b.core.length || b.start.length)) {
    return `<div class="build"><div class="vs-label">📦 テンプレ（人気ビルド）${src}</div>
      ${b.start.length ? `<div>スタート: <b>${b.start.flat().map(esc).join(' ＋ ')}</b></div>` : ''}
      ${b.core.length ? `<div>コア: <b>${b.core.map(esc).join(' → ')}</b></div>` : ''}
      ${b.shoes ? `<div>ブーツ: <b>${esc(b.shoes)}</b></div>` : ''}
      ${b.slots.length ? `<details><summary>何個目に何を買うか（候補）</summary><ol>${b.slots.map((x) =>
        `<li>${x.map(esc).join(' / ')}</li>`).join('')}</ol></details>` : ''}
    </div>`;
  }
  return '';
}
// 対面タブ: 選んだ相手1体の強み・対策・避けるスキル・強い時間を表示する
// （BAN/PICKで入れた相手はボタンで、それ以外は一覧から選ぶ）
let vsSelected = '';
let vsFromLookup = false;
// 対面勝率から有利・不利の目安を出す（30試合未満は「データ少なめ」）
function matchupRating(m) {
  if (!m) return null;
  const label = m.win >= 54 ? '有利' : m.win >= 51.5 ? 'やや有利' : m.win > 48.5 ? '互角' : m.win > 46 ? 'やや不利' : '不利';
  const cls = m.win >= 51.5 ? 'good' : m.win > 48.5 ? 'even' : 'bad';
  return { label: m.games < 30 ? `${label}?` : label, cls, text: `対面勝率 ${m.win}%（${m.games}試合${m.games < 30 ? '・データ少なめ' : ''}）` };
}
const asList = (v) => Array.isArray(v) ? v : v ? [v] : [];
function enemyCard(c, name) {
  const info = (L.enemyInfo || {})[name] || {};
  const s = statOf(c);
  const r = matchupRating(s && s.matchups && s.matchups[name]);
  const note = c.matchupNotes && c.matchupNotes[name];
  const sec = (title, body) => body ? `<div class="vs-sec"><div class="vs-label">${esc(title)}</div>${body}</div>` : '';
  const ul = (items) => items.length ? `<ul>${items.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>` : '';
  const ol = (items) => items.length ? `<ol>${items.map((t) => `<li>${esc(t)}</li>`).join('')}</ol>` : '';
  const dodge = asList(info.dodge).map((d) => Array.isArray(d)
    ? `<li><b>${esc(d[0])}</b><br><span class="muted">${esc(d[1])}</span></li>` : `<li>${esc(d)}</li>`).join('');
  // 対面メモは { early, mid, late, tip } か文字列
  const noteHtml = !note ? '' : typeof note === 'string' ? `<p>${esc(note)}</p>` : `
    <dl class="vs-flow">
      ${note.early ? `<dt>Lv1〜3</dt><dd>${esc(note.early)}</dd>` : ''}
      ${note.mid ? `<dt>Lv4〜6</dt><dd>${esc(note.mid)}</dd>` : ''}
      ${note.late ? `<dt>Lv6以降・アイテム後</dt><dd>${esc(note.late)}</dd>` : ''}
    </dl>
    ${note.tip ? `<p class="vs-tip">💡 ${esc(note.tip)}</p>` : ''}`;
  return `<div class="vs-card">
    <div class="vs-head">
      <h3>${esc(name)}${info.role ? `<span class="tag">${esc(info.role)}</span>` : ''}</h3>
      ${r ? `<span class="badge ${r.cls}">${esc(r.label)}</span><span class="muted small">${esc(r.text)}</span>` : ''}
    </div>
    ${info.summary ? `<p class="vs-summary">${esc(info.summary)}</p>` : ''}
    ${!Object.keys(info).length && !note ? '<p class="muted small">この相手の情報はまだありません。</p>' : ''}
    ${noteHtml ? `<div class="vs-note"><div class="vs-label">${esc(c.name)}で戦うとき</div>${noteHtml}</div>` : ''}
    ${sec('⚠ 気をつけるスキル（避け方）', dodge ? `<ul class="vs-dodge">${dodge}</ul>` : '')}
    ${sec('戦い方', ol(asList(info.howto || info.counter)))}
    ${info.goTime || info.backTime ? `<div class="vs-time">
      ${info.goTime ? `<div class="go"><div class="vs-label">◎ 強気に出ていい時間</div>${esc(info.goTime)}</div>` : ''}
      ${info.backTime || info.spike ? `<div class="back"><div class="vs-label">✕ 引くべき時間</div>${esc(info.backTime || info.spike)}</div>` : ''}
    </div>` : ''}
    ${sec('相手の強み', ul(asList(info.strength)))}
    ${sec('相手に効く装備', info.items ? `<p>${esc(info.items)}</p>` : '')}
  </div>`;
}
const glossaryHtml = () => (window.GLOSSARY || []).map(([t, d]) =>
  `<div class="gl-row"><b>${esc(t)}</b><span>${esc(d)}</span></div>`).join('');
function renderVs(c) {
  const known = Object.keys(L.enemyInfo || {}).sort();
  const s = statOf(c);
  const hasData = (e) => known.includes(e) || (c.matchupNotes && c.matchupNotes[e]) || (s && s.matchups && s.matchups[e]);
  const picked = LS.pick.enemies.filter((e) => e !== c.name);
  const candidates = picked.filter(hasData);
  const noData = picked.filter((e) => !hasData(e));
  // BAN/PICKから選んでいた相手が消えたら、残っている先頭の相手に切り替える

  $('cheat-body').innerHTML = `

    <div class="vs-picker">
      ${candidates.length ? `<div class="vs-label">BAN/PICKの相手</div>
        <div class="chips">${candidates.map((n) =>
          `<button class="chip toggle ${n === vsSelected ? 'on' : ''}" data-vs="${esc(n)}">${esc(n)}</button>`).join('')}</div>` : ''}
      <select id="vs-lookup">
        <option value="">ほかの相手を見る…</option>
        ${known.filter((n) => n !== c.name).map((n) =>
          `<option ${vsFromLookup && n === vsSelected ? 'selected' : ''}>${esc(n)}</option>`).join('')}
      </select>
    </div>
    ${vsSelected ? enemyCard(c, vsSelected)
      : '<p class="muted small">BAN/PICKで相手を入れるか、上の一覧から選ぶと表示されます。</p>'}
    ${noData.length ? `<p class="muted small">情報が未登録の相手: ${esc(noData.join('、'))}（data/${esc(L.id)}.js の enemyInfo に追加できます）</p>` : ''}`;
  $('vs-lookup').addEventListener('change', (e) => {
    if (!e.target.value) return;
    vsSelected = e.target.value; vsFromLookup = true; renderCheat();
  });
  $('cheat-body').querySelectorAll('[data-vs]').forEach((b) => b.addEventListener('click', () => {
    vsSelected = b.dataset.vs; vsFromLookup = false; renderCheat();
  }));
}

function renderCheatWarn() {
  // BAN/PICKで入れた相手から、選択中チャンピオン視点の注意を出す
  const c = getChamp(LS.champ);
  const en = LS.pick.enemies;
  const lines = [];
  const s = statOf(c);
  const trusted = (e) => s && s.matchups && s.matchups[e] && s.matchups[e].games >= 30;
  const weak = en.filter((e) => c.weakVs.includes(e) && !trusted(e));
  if (weak.length) lines.push(`苦手（相性メモ）: ${weak.join('、')}`);
  const strong = en.filter((e) => c.strongVs.includes(e) && !trusted(e));
  if (strong.length) lines.push(`得意（相性メモ）: ${strong.join('、')}`);
  const vs = en.filter((e) => s && s.matchups && s.matchups[e])
    .map((e) => `${e} ${s.matchups[e].win}%（${s.matchups[e].games}試合）`);
  if (vs.length) lines.push(`対面勝率: ${vs.join('、')}`);
  const divers = en.filter((e) => (L.divers || []).includes(e));
  if (divers.length) lines.push(`ダイバー: ${divers.join('、')} → 守りのスキルを残す`);
  const imm = en.filter((e) => (L.immobile || []).includes(e));
  if (imm.length) lines.push(`狙い目（逃げスキルが少ない）: ${imm.join('、')}`);
  $('cheat-warn').innerHTML = lines.map(esc).join('<br>');
}
$('cheat-tabs').addEventListener('click', (e) => {
  const id = e.target.dataset.id;
  if (id) { cheatId = id; renderCheat(); }
});

// ================= 反省メモ =================
let selectedReasons = new Set();

function renderCurrent() {
  const g = LS.current;
  const box = $('current-game');
  if (!g) {
    box.innerHTML = `
      <h2>試合を始める（${esc(LS.champ)}）</h2>
      <p class="muted small">使用チャンピオンとBAN/PICKの内容（${esc(L.allyLabel)}・相手）が試合に記録されます。</p>
      <div class="row"><button class="btn primary" id="start-game">試合開始</button></div>`;
    $('start-game').addEventListener('click', () => {
      LS.current = { id: Date.now(), start: Date.now(), champ: LS.champ,
        ally: LS.pick.ally, enemies: [...LS.pick.enemies], deaths: [] };
      save(); renderMemo(); toast('試合を開始しました');
    });
    return;
  }
  box.innerHTML = `
    <h2>試合中のメモ：${esc(g.champ)} <span class="muted small">${esc(fmtDate(g.start))}〜 ／ ${esc(L.allyLabel)}: ${esc(g.ally || '未設定')}
      ${g.enemies.length ? ' ／ 相手: ' + esc(g.enemies.join('、')) : ''}</span></h2>
    <div class="grid2">
      <div>
        <label class="field">死因（タップで選択）</label>
        <div class="chips" id="reason-chips">${L.deathReasons.map((r) =>
          `<span class="chip toggle ${selectedReasons.has(r) ? 'on' : ''}" data-r="${esc(r)}">${esc(r)}</span>`).join('')}</div>
        <label class="field" style="margin-top:10px">ゲーム内時間（任意）</label>
        <input type="text" id="death-time" placeholder="例: 12:30">
      </div>
      <div>
        <label class="field">メモ（Ctrl+Enterで保存）</label>
        <textarea id="death-note" placeholder="何が起きた？ 次はどうする？"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn primary" id="save-death">デスを記録</button></div>
      </div>
    </div>
    <h3>この試合のデス（${g.deaths.length}）</h3>
    <div>${g.deaths.length ? g.deaths.map(deathHtml).join('') : '<span class="muted small">まだありません</span>'}</div>
    <h3>試合終了</h3>
    <textarea id="game-note" placeholder="試合全体の振り返り（任意）"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="btn primary" id="end-win">勝ち</button>
      <button class="btn" id="end-lose">負け</button>
      <button class="btn danger" id="end-cancel">この試合を破棄</button>
    </div>`;

  $('reason-chips').addEventListener('click', (e) => {
    const r = e.target.dataset.r;
    if (!r) return;
    selectedReasons.has(r) ? selectedReasons.delete(r) : selectedReasons.add(r);
    e.target.classList.toggle('on');
  });
  const saveDeath = () => {
    const note = $('death-note').value.trim();
    if (!note && !selectedReasons.size) { toast('死因かメモを入れてください'); return; }
    g.deaths.push({ at: Date.now(), time: $('death-time').value.trim(), reasons: [...selectedReasons], note });
    selectedReasons = new Set();
    save(); renderMemo(); toast('記録しました');
  };
  $('save-death').addEventListener('click', saveDeath);
  $('death-note').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.ctrlKey) saveDeath(); });
  const end = (result) => {
    g.result = result; g.note = $('game-note').value.trim(); g.end = Date.now();
    LS.games.unshift(g); LS.current = null;
    save(); renderMemo(); toast('試合を保存しました');
  };
  $('end-win').addEventListener('click', () => end('win'));
  $('end-lose').addEventListener('click', () => end('lose'));
  $('end-cancel').addEventListener('click', () => {
    if (!confirm('この試合のメモを破棄しますか？')) return;
    LS.current = null; save(); renderMemo();
  });
}

function deathHtml(d) {
  return `<div class="death">
    <div class="meta">${d.time ? esc(d.time) + ' ／ ' : ''}${esc(fmtDate(d.at))}</div>
    ${d.reasons.length ? `<div class="chips" style="margin-top:2px">${d.reasons.map((r) => `<span class="chip">${esc(r)}</span>`).join('')}</div>` : ''}
    ${d.note ? `<div>${esc(d.note)}</div>` : ''}
  </div>`;
}

const visibleGames = () => LS.memoAll ? LS.games : LS.games.filter((g) => g.champ === LS.champ);

function renderStats() {
  $('memo-all').checked = LS.memoAll;
  const games = visibleGames();
  const all = [...games, ...(LS.current && (LS.memoAll || LS.current.champ === LS.champ) ? [LS.current] : [])];
  const counts = {};
  all.forEach((g) => g.deaths.forEach((d) => d.reasons.forEach((r) => { counts[r] = (counts[r] || 0) + 1; })));
  const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const max = rows.length ? rows[0][1] : 1;
  const wins = games.filter((g) => g.result === 'win').length;
  $('stats').innerHTML = `
    <p class="small">${LS.memoAll ? '全チャンピオン' : esc(LS.champ)}：試合数 ${games.length}（${wins}勝 ${games.length - wins}敗）／ デス合計 ${all.reduce((n, g) => n + g.deaths.length, 0)}</p>
    ${rows.length ? rows.map(([r, n]) => `
      <div class="stat-row"><span>${esc(r)}</span><div class="bar" style="width:${(n / max) * 100}%"></div><span>${n}</span></div>`).join('')
      : '<span class="muted small">まだデータがありません</span>'}`;
}

function renderHistory() {
  const games = visibleGames();
  $('history-title').textContent = `過去の試合（${LS.memoAll ? '全チャンピオン' : LS.champ}）`;
  $('history').innerHTML = games.length ? games.map((g) => `
    <details class="game">
      <summary>
        <span class="${g.result === 'win' ? 'win' : 'lose'}">${g.result === 'win' ? '勝ち' : '負け'}</span>
        ${esc(fmtDate(g.start))} ／ ${esc(g.champ)} ／ ${esc(L.allyLabel)}: ${esc(g.ally || '-')} ／ デス ${g.deaths.length}
      </summary>
      ${g.enemies.length ? `<p class="small muted">相手: ${esc(g.enemies.join('、'))}</p>` : ''}
      ${g.note ? `<p>${esc(g.note)}</p>` : ''}
      ${g.deaths.map(deathHtml).join('')}
      <div class="row" style="margin-top:6px"><button class="btn danger sm" data-del="${g.id}">削除</button></div>
    </details>`).join('') : '<span class="muted small">まだありません</span>';
}
$('history').addEventListener('click', (e) => {
  const id = e.target.dataset.del;
  if (!id || !confirm('この試合を削除しますか？')) return;
  LS.games = LS.games.filter((g) => String(g.id) !== id);
  save(); renderMemo();
});
$('memo-all').addEventListener('change', (e) => { LS.memoAll = e.target.checked; save(); renderMemo(); });

function renderMemo() { renderCurrent(); renderStats(); renderHistory(); }

// 書き出し・読み込み（このレーンの分だけ）
$('export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ lane: L.id, ...LS }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `lol-note-${L.id}-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
$('import').addEventListener('click', () => $('import-file').click());
$('import-file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.games)) throw new Error();
    if (data.lane && data.lane !== L.id) { toast(`別レーン（${data.lane}）のデータです`); return; }
    const known = new Set(LS.games.map((g) => g.id));
    LS.games = [...LS.games, ...data.games.filter((g) => !known.has(g.id))].sort((a, b) => b.start - a.start);
    LS.custom = [...new Set([...LS.custom, ...(data.custom || [])])];
    for (const [k, v] of Object.entries(data.notes || {})) if (!LS.notes[k]) LS.notes[k] = v;
    save(); renderAll(); toast('読み込みました');
  } catch (err) { toast('読み込みに失敗しました'); }
  e.target.value = '';
});

// ================= 初期表示 =================
function renderAll() { renderHeader(); renderPick(); renderCheat(); renderCheatWarn(); renderMemo(); }
renderAll();
})();
</script>
</body>
</html>
